<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&family=Noto+Serif+KR:wght@400;600;700&display=swap"/>
<style>
  body{margin:0;font-family:"Noto Sans KR",sans-serif;background:#FAF8F3;color:#1B1B18}
  .hero{position:relative;width:360px;height:520px;background:linear-gradient(160deg,#B8871F,#E3A72E);display:flex;flex-direction:column;justify-content:flex-end;padding:28px 20px 36px;box-sizing:border-box}
  .cat{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:rgba(250,248,243,.8);margin:0 0 12px;font-family:"Noto Sans KR",sans-serif}
  h1.pagzly-display-headline{color:#FAF8F3;font-size:1.85rem;line-height:1.15;margin:0;word-break:keep-all;overflow-wrap:break-word;font-family:"Noto Serif KR", "Noto Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;font-weight:700;letter-spacing:-0.02em}
  .sub{margin:12px 0 0;color:rgba(250,248,243,.88);font-size:14px;font-family:"Noto Sans KR",sans-serif;font-weight:400}
  .meta{position:absolute;top:12px;left:12px;right:12px;font-size:10px;color:rgba(250,248,243,.65);font-family:"Noto Sans KR",sans-serif}
</style>
</head>
<body>
  <div class="hero" data-headline-face="serif">
    <div class="meta">식품/건강기능식품 · face=serif</div>
    <p class="cat">식품/건강기능식품</p>
    <h1 class="pagzly-display-headline">아침 테이블에 올리는 고소한 한 스푼</h1>
    <p class="sub">본문은 Noto Sans KR 유지 — 헤드라인만 디스플레이 페이스</p>
  </div>
</body>
</html>
